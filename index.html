/* Página: layout do UI kit "vitrine" do design system — header fixo, herói azul no pedido, perguntas em card, vitrine com coluna principal + lateral */
body{background:var(--bg-page)}
.wrap{max-width:var(--container-max);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hdr{background:var(--surface-card);border-bottom:1px solid var(--border-1);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface-brand-deep)}
.util{background:var(--surface-brand-deep);color:var(--text-on-brand);font:var(--fw-semibold) 12px/1 var(--font-sans)}
.util .wrap{display:flex;justify-content:space-between;gap:16px;padding-block:9px;flex-wrap:wrap}
.util span{display:inline-flex;gap:6px;align-items:center}
.util .r{display:flex;gap:20px}
.bar{display:flex;align-items:center;gap:20px;padding-block:14px}
.wordmark{all:unset;cursor:pointer;font:900 26px/1 var(--font-display);letter-spacing:-.02em;color:var(--text-brand)}
.search{flex:1;min-width:0;height:40px;border-radius:999px;background:var(--surface-sunken);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--text-3);font:var(--type-body-sm);cursor:pointer;border:0;text-align:left}
.search span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cep{display:flex;align-items:center;gap:6px;font:var(--type-caption);color:var(--text-2);white-space:nowrap}
.cep b{color:var(--text-brand)}
.cartb{all:unset;cursor:pointer;position:relative;display:flex;align-items:center;gap:8px;color:var(--text-brand)}
.cartb:focus-visible{box-shadow:var(--shadow-focus);border-radius:8px}
.cartb .n{position:absolute;top:-7px;left:14px;min-width:18px;height:18px;border-radius:9px;background:var(--highlight);color:#fff;font:800 11px/18px var(--font-sans);text-align:center;padding:0 4px}
.cartb b{font:var(--fw-bold) 13px/1.2 var(--font-sans)}

function recommend(){

  for(const p of pool){const hit=p.ing.find(i=>al.includes(i));
    if(hit){out.push({p,k:"seguranca",why:`Contém ${hit}, que você informou.`});continue}
    if(who==="gestante"&&p.gest){out.push({p,k:"seguranca",why:"Retinoides não são indicados na gestação. Confirme com seu médico."});continue}
    if(p.red){out.push({p,k:"repetido",why:p.red+"."});continue}
    keep.push(p)}
  const by={};keep.sort((a,b)=>b.s-a.s||b.own-a.own).forEach(p=>{if(!by[p.role])by[p.role]=p;else out.push({p,k:"repetido",why:"Mesma função de um item já selecionado, com nota maior."})});
  let sel=Object.values(by);
  if(st.budget){let sum=0;const fit=[];for(const p of sel){if(sum+p.p<=st.budget){fit.push(p);sum+=p.p}else out.push({p,k:"orcamento",why:"Passaria do seu orçamento."})}sel=fit}
  return{sel,out};
}

/* ---------- voz: ditado (reconhecimento de fala) e leitura em voz alta ---------- */
let rec=null,simT=null;
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="pt-BR";speechSynthesis.speak(u)}catch(e){}}
function setMic(on,msg){const b=$("#mic");if(!b)return;b.classList.toggle("mic-on",on);b.setAttribute("aria-pressed",on);b.innerHTML=on?'<span class="dot"></span>Ouvindo… toque para parar':ic("mic")+"Falar em vez de digitar";if(msg!=null)$("#micNote").textContent=msg}
function simulate(){const frase="Minha pele está muito seca e descascando com o frio, até R$ 120";let i=0;setMic(true,"Microfone indisponível aqui. Simulando a transcrição de uma fala.");clearInterval(simT);
  simT=setInterval(()=>{const r=$("#req");if(!r){clearInterval(simT);return}i++;r.value=frase.slice(0,i);st.text=r.value;$("#cnt").textContent=r.value.length+"/500";if(i>=frase.length){clearInterval(simT);setMic(false,"Transcrição pronta. Confira o texto e toque em Ver produtos.")}},35)}
function wireVoice(){const b=$("#mic");if(!b)return;
  b.onclick=()=>{if(b.getAttribute("aria-pressed")==="true"){try{rec&&rec.stop()}catch(e){}clearInterval(simT);setMic(false,"");return}
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){simulate();return}
    try{rec=new SR();rec.lang="pt-BR";rec.interimResults=true;rec.continuous=false;let got=false;
      rec.onresult=e=>{got=true;const t=[...e.results].map(r=>r[0].transcript).join(" ");const r=$("#req");if(r){r.value=t;st.text=t;$("#cnt").textContent=t.length+"/500"}};
      rec.onerror=()=>{if(!got)simulate()};
      rec.onend=()=>{if(got)setMic(false,"Transcrição pronta. Confira o texto e toque em Ver produtos.")};
      rec.start();setMic(true,"Pode falar. Descreva o que você precisa ou o que está sentindo.");setTimeout(()=>{if(!got&&$("#mic")&&$("#mic").getAttribute("aria-pressed")==="true"){try{rec.abort()}catch(e){}simulate()}},6000)}catch(e){simulate()}}}

/* ---------- render + eventos ---------- */
function render(){
  const v=st.view;
  app.innerHTML=v==="call"?vCall():v==="ask"?vAsk():v==="questions"?vQuestions():v==="vitrine"?vVitrine():v==="checkout"?vCheckout():v==="done"?vDone():vState(v.split(":")[1]);
  const n=$("#cartN");n.hidden=!cart.size;n.textContent=cart.size;
  const req=$("#req");if(req){req.oninput=()=>{st.text=req.value;$("#cnt").textContent=req.value.length+"/500"};$("#send").onclick=()=>start(req.value)}
  app.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{st.text=b.dataset.ex;start(b.dataset.ex)});
  app.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{const q=Q[st.step],id=b.dataset.opt;
    if(q.multi){let a=st.alg;a=id==="nenhuma"?["nenhuma"]:(a.includes(id)?a.filter(x=>x!==id):[...a.filter(x=>x!=="nenhuma"),id]);st.alg=a}else st[q.k]=id;render()});
  const oth=$("#other");if(oth)oth.oninput=()=>{st.other=oth.value;$("#next").disabled=!oth.value.trim()};
  const cs=$("#consent");if(cs)cs.onchange=()=>{st.consent=cs.checked};
  if($("#next"))$("#next").onclick=()=>{if(st.step<Q.length-1){st.step++;render()}else go("vitrine")};
  if($("#skip"))$("#skip").onclick=()=>{const q=Q[st.step];if(q.multi)st.alg=["nenhuma"];else st[q.k]=q.o[0][0];if(st.step<Q.length-1){st.step++;render()}else go("vitrine")};
  if($("#back"))$("#back").onclick=()=>{if(st.step){st.step--;render()}else go("ask")};
  if($("#edit"))$("#edit").onclick=()=>{st.step=0;go("questions")};
  app.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const id=b.dataset.add;cart.has(id)?cart.delete(id):cart.add(id);render()});
  if($("#kit"))$("#kit").onclick=()=>{recommend().sel.forEach(p=>cart.add(p.id));render()};
  app.querySelectorAll("[data-checkout]").forEach(b=>b.onclick=()=>go("checkout"));
  app.querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>{st.called=false;go("call")});
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{st[b.dataset.g]=b.dataset.v;render()});
  app.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{cart.delete(b.dataset.rm);render()});
  if($("#pay"))$("#pay").onclick=()=>{cart.clear();go("done")};
  if($("#backVit"))$("#backVit").onclick=()=>go(st.view==="checkout"&&st.text?"vitrine":"ask");
  wireVoice();
  if($("#reqCall"))$("#reqCall").onclick=()=>{const t=$("#phone").value.trim();if(t.replace(/\D/g,"").length<10){$("#phone").focus();$("#phone").setAttribute("aria-invalid","true");return}st.phone=t;st.called=true;render()};
  if($("#call"))$("#call").onclick=()=>{st.called=false;go("call")};
  app.querySelectorAll("[data-speak]").forEach(b=>b.onclick=()=>speak(b.closest(".sp-state").innerText.replace(/Ouvir|Falar com farmacêutico/g,"")));
  if($("#readPage"))$("#readPage").onclick=()=>speak("Conte o que você precisa, com suas palavras. Você pode digitar, tocar em Falar em vez de digitar, ou pedir uma ligação de um farmacêutico.");
  if($("#newReq"))$("#newReq").onclick=()=>{st.text="";go("ask")};
}
$("#home").onclick=()=>go("ask");
$("#callTop").onclick=()=>go("call");
$("#cartBtn").onclick=()=>go("checkout");
/* tema: claro por padrão; o botão alterna */
const root=document.documentElement;
root.setAttribute("data-theme","light"); /* abre sempre no tema claro (fundo branco); o botão alterna para o escuro */
function isDark(){const t=root.getAttribute("data-theme");return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function syncThemeIcon(){$("#themeIco").className="sp-icon "+(isDark()?"i-sun":"i-moon")}
$("#theme").onclick=()=>{root.setAttribute("data-theme",isDark()?"light":"dark");syncThemeIcon()};
syncThemeIcon();
render();
</script>
</body>
